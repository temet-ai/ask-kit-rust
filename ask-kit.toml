id = "temet.rust"
name = "rust"
version = "0.1.0"
min_ask_kit = "0.2.0"
requires = ["cargo", "git"]
says = "a Rust workspace through cargo: does it compile and what are the errors (file, line, code, message, the compiler's suggested fix), which tests fail and why (the failing assertion and its output), what clippy says, which crates are in the workspace and how they depend on each other, why a dependency is in the tree and in how many versions, which features are on, what is outdated, how long a build takes and what takes the time; and acting on it (cargo fmt, cargo fix, clippy --fix, cargo add, remove, update, editing source to fix a compile error or a failing test)"
keywords = ["cargo", "rust(c|fmt|up)?", "clippy", "nextest", "crates?", "Cargo\\.(toml|lock)", "(rust|cargo) workspace", "workspace members", "borrow checker", "E0\\d{3}", "\\w+\\.rs"]
route_hint = "a question that names cargo, clippy, rustc, rustfmt, crates, Cargo.toml or a Rust workspace is rust: whether it builds, which tests fail, what clippy reports, which crates it has, why a crate is in the dependency tree, which crates are outdated, how long a build takes, and fixing a compile error or failing test; a project's tests, lint, typecheck or build that do not name Rust are tests, and packages that are not crates (npm, Python, Go) are deps; where something is defined or how the code works is code; commits, branches and diffs are git; a CI run or pull request is github; a running service and its logs are ops; what a past session did is sessions"
cite = "`path:line` for code, `crate version` for a dependency"
instructions = "instructions.md"
state_key = "${RUST_ROOT}"
acts = [
  "cargo fmt, when it rewrites files (not --check)",
  "cargo fix, and cargo clippy --fix (they rewrite source files)",
  "cargo add, remove, update and generate-lockfile (Cargo.toml and Cargo.lock)",
  "cargo run, clean, new and init (run the program, delete the target folder, create packages)",
  "edits and writes to source files in the repository",
]

[[settings]]
key = "RUST_ROOT"
about = "the git repository holding the Rust workspace; found from the folder the agent works in"
detect = ["git", "rev-parse", "--show-toplevel"]

[[settings]]
key = "CARGO_TIMEOUT_SECONDS"
about = "how long one cargo run may take before it is killed"
default = "600"

[[sources]]
kind = "module"
name = "cargo"
module = "cargo.mjs"
api = "api.d.ts"

# The code itself, for reading and (when the caller asked for a change) editing. Credentials and build output are never read.
[[sources]]
kind = "folder"
name = "rust"
path = "${RUST_ROOT}"
about = "the repository holding the Rust workspace"
exclude = [
  "target/**", "**/target/**", "node_modules/**", ".git/**",
  "*.env", ".env*", "*token*", "*secret*", "*credential*", "*passw*", "*.pem", "*.key", "id_rsa*", "id_ed25519*",
  "oauth*", "auth.json", "*cookie*", "*.sqlite*", "*.db", ".cargo/credentials*", "**/.cargo/credentials*",
]

[[roles]]
name = "fixer"
when = "a request to make the workspace compile, make a failing test pass, or clear clippy warnings"
patterns = ["^(please )?(fix|make)\\b.*\\b(compile|build|test|clippy|warning|error)", "\\bmake (it|the \\w+) (compile|pass|build)\\b"]
instructions = "roles/fixer.md"

[[roles]]
name = "reviewer"
when = "a question about the quality or structure of Rust code: crate boundaries, dependencies, error handling, tests, whether to split a crate"
patterns = ["\\b(review|audit)\\b.*\\b(rust|crate|code)", "\\bshould (i|we) split\\b", "\\bcrate (boundar|structure|layout)\\w*"]
instructions = "roles/reviewer.md"
